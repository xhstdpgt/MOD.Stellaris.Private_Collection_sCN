 trait_aquatic_specialist: "水生专家"
 trait_aquatic_specialist_desc: "§L这个物种已经适应了生活在海洋深处并执行复杂工作。但在陆地上活动时面临严重的不适应。§!\n§R需要§! §Y海洋世界§! §R家园§!."
 trait_aquatic_specialist_tooltip: "统治者、专家、复合子个体在§Y海洋§!星球产出：§G+5%§!\n宜居性 §Y被淹没的居住站§!：§G+70%§!"
 ap_hydrocentric_trait_tooltip: "§Y解锁特质：§! §G水生§! 这可以提高统治者、专家、复合子个体的产出，但是在非海洋世界上会受到巨大的宜居性惩罚。"

 ap_mechromancy_tt1: "被击败的有机利维坦有时可以复活。\n被净化的有机或石质智慧物种 $pops_with_icon$ 有33%的概率被复生为半机械死灵。\n§Y解锁特性：§! §G死灵§! 和 §G机械世界偏好§! 对有机物种的修改。"

 hive_bred: "蜂巢培育"
 hive_bred_desc: "这个物种被培育成在蜂巢世界中表现出色，但是在任何其他环境中都会受到负面影响。"
 ap_hive_worlds_desc1: "§Y解锁特质：§! §G$hive_bred$§! 这提高了矿工、技工和农夫的基础产出 §G+1§! 同时大幅降低它们在非蜂巢世界中的宜居性。"

