 building_archaeostudies_lab_desc: "利用我们在古代技术方面的专业知识，我们能够建造一个$building_archaeostudies_lab$，可以修复和利用迄今为止被认为无法使用的文物。"

 trait_robot_specialist_aquatic: "防水机器人"
 trait_robot_specialist_aquatic_desc: "§L这些机器最初是为海洋深处的复杂任务而设计的，但在陆地上运行时面临严重的不适应。§!\n§R需要§! §Y海洋世界§! §R家园§!."
