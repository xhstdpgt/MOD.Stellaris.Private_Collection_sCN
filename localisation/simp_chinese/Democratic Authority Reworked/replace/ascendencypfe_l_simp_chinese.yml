l_simp_chinese:
#事件
 democraticoverhaul.2.name: "[Root.GetRulerTitle] 在任期结束前去世"
 democraticoverhaul.2.desc: "我们的[Root.GetRulerTitle] 在选举任期结束前去世。 §Y[Root.GetRulerName]§! 已被任命接替 [Root.GetRulerTitle] 的职务并完成任期。"
 democraticoverhaul.3.name: "新[Root.GetRulerTitle] 当选"
 democraticoverhaul.3.desc: "§Y[Root.GetRulerName]§! 当选为我们帝国下一任期的 [Root.GetRulerTitle]。"
 democraticoverhaul.4.name: "[Root.GetRulerTitle]连任"
 democraticoverhaul.4.desc: "§Y[Root.GetRulerName]§! 连任为我们帝国下一任期的 [Root.GetRulerTitle]。"
 democraticoverhaul.5.name: "[Root.GetRulerTitle] 涉嫌腐败"
 democraticoverhaul.5.desc: "§Y[Root.GetRulerName]§!，我们的 [Root.GetRulerTitle]，被指控在任期内涉嫌腐败。虽然 [Root.GetRulerName] 坚决否认任何不法行为，但对其行为的反腐败调查已经开始。"
 democraticoverhaul.6.name: "[Root.GetRulerTitle] 免责"
 democraticoverhaul.6.desc: "§Y[Root.GetRulerName]§!，我们的 [Root.GetRulerTitle] 被证明没有任何腐败行为————在反腐败调查中没有发现任何证据。他的新闻发言人公开反对[Root.GetRulerTitle]的指控者，谴责他们试图损害国家最高职位的行为。"
 democraticoverhaul.7.name: "[Root.GetRulerTitle] 与犯罪活动有关"
 democraticoverhaul.7.desc: "对[Root.GetRulerTitle] §Y[Root.GetRulerName]§! 的调查得出了令人震惊的结果，揭露他们在任职期间参与了犯罪活动。指控者自豪地站在自认为是的法律制高点，但大多数公民只感觉到被背叛了，并要求有所作为。"
 democraticoverhaul.8.name: "[Root.GetRulerTitle] 面临第二轮腐败指控"
 democraticoverhaul.8.desc: "[Root.GetRulerTitle] §Y[Root.GetRulerName]§! 再次因在政治职务期间涉嫌犯罪行为而受到指控。这发生在对其类似指控进行调查并被证明清白之后。现在开始新一轮调查，以确定最新指控是否有任何事实依据，但公民对再次出现任何结果持怀疑态度。"
 democraticoverhaul.9.name: "[Root.GetRulerTitle] 新的腐败指控被驳回"
 democraticoverhaul.9.desc: "§Y[Root.GetRulerName]§!，我们的 [Root.GetRulerTitle] 再次证明了他们的清白。他们的政治对手因此面临着大规模的审查，他们知道进一步的指控只会进一步损害他们的声誉。"
 democraticoverhaul.10.name: "新 [Root.GetRulerTitle] 任命完成任期"
 democraticoverhaul.10.desc: "在成功解除前任职务后，§Y[Root.GetRulerName]§! 完成了任期的任命。"
 
 #政策
 policy_democraticoverhaul_election_policy: "选举政策"
 policy_democraticoverhaul_election_policy_desc: "有几种类型的民主选举。\n"
 election_policy_equal: "公平竞争"
 election_policy_equal_desc: "我们的选举完全公正。新领导人与老领导人连任的可能性同样大。\n\n 重新选举统治者的机会：§Y50%§!"
 election_policy_imbalance: "优势选举"
 election_policy_imbalance_desc: "如果要取代我们当前的统治者，必须展示其功绩。\n\n 重新选举统治者的机会：§Y65%§!"
 election_policy_one_term: "一届制"
 election_policy_one_term_desc: "统治者仅被选举为一届，以遏制潜在的腐败并为我们的领导层引入新的想法。\n\n 重新选举统治者的机会：§Y0%§!"
 election_policy_shadow: "内定选举"
 election_policy_shadow_desc: "无论他们是否清楚§R这可能导致不良的后果§!，我们的人民仍然会投票支持他连任。\n\n重新选举统治者的机会：§Y95%§!"
 democraticoverhaul_corrupt: "不正常的连任"
 democraticoverhaul_corrupt_desc: "§L在多次以多数票通过连任选举后，人们开始质疑他的选举是否涉嫌腐败？§!\n"
 democraticoverhaul_criminal: "犯罪关联"
 democraticoverhaul_criminal_desc: "§L统治者在任期间被曝与犯罪活动有关，这件事被闹得沸沸扬扬人尽皆知。但不思议的是，议会仍未有对此事的反应。§!\n"
 
 #响应
 DO_POLLS: "下一次选举再做决定。"
 DO_IMPEACH: "启动弹劾程序并重新选举统治者。"
 DO_INVESTIGATION_1: "让我们看看有什么发现。"
 DO_INVESTIGATION_2: "让我们看看他们这次发现了什么。"
 DO_INVESTIGATION_SC_1: "他们将找不到任何重要线索。"
 DO_INVESTIGATION_SC_2: "不留任何机会。"
 DO_EXONERATED_1: "浪费大家的时间。"
 DO_EXONERATED_2: "一切的争吵，都是为了什么？"