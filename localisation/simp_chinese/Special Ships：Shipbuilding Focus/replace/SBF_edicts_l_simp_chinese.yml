 SBF_BG_DESC: "专注研发建造性能卓越的设计精妙的大型特种舰船。"
 SBF_MR_DESC: "专注研发建造专用于行星入侵的部队运输舰船，也适用太空跳帮战。"
 SBF_FT_DESC: "专注研发建造新式巨构装置。引入太空雷区、机动要塞乃至跨星系打击的巨炮。\n——————————\n（所有由要塞化舰船建造焦点提供的特殊舰船必须由工程舰在轨道上建造）\n——————————\n虽然太空布雷站可以无限建造，但机动要塞和超新星炮每个帝国仅限建造一座"
