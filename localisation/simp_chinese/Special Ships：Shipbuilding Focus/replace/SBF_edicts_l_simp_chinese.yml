 SBF_CA_DESC: "专注研发建造配备强力舰载机及其配套辅助子系统的高级航母。"
 SBF_EX_DESC: "专注研发建造射程远超常规导弹舰的超远程导弹舰。"
 SBF_HV_DESC: "专注研发建造能提供碾压敌方火力的重装甲舰船。"
