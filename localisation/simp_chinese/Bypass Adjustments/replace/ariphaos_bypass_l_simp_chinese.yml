l_simp_chinese:
 ariphaos_requires_black_hole: "$TRIGGER_FAIL$必须建在黑洞附近。"
 ariphaos_bypass_cooldown: "星门跃迁迟滞"
 ariphaos_bypass.3.name: "星门通行受阻"
 ariphaos_bypass.3.desc: "舰队试图在争议星系通过星门进出。"
 ariphaos_bypass.11.name: "占领星系中的敌对势力星门"
 ariphaos_bypass.11.desc: "我们已经占领[FROM.solar_system.GetName]星系，该星系存在一座敌对星门。若决定行动，我们可运用技术使星门过载——只需持续供给充足能量并坚守该星系，直至维度乱流摧毁其结构。"
 ariphaos_bypass.11.optA: "执行干扰程序"
 ariphaos_bypass.11.optB: "不。我们有个计划，可以利用这个敌对星门。"
 ariphaos_bypass.12.name: "星门干扰进行中"
 ariphaos_bypass.12.desc: "[FROM.FROM.solar_system.GetName]已被敌对势力占领，[From.GetName]正试图瘫痪我方星门！必须夺回星系以保全星门！"
 ariphaos_bypass.14.name: "星门已瘫痪"
 ariphaos_bypass.14.desc: "我们成功瘫痪了[FROM.FROM.FROM.FROM.solar_system.GetName]星系的星门，其已脱离星门网络。"
 ariphaos_bypass.15.name: "星门失效"
 ariphaos_bypass.15.desc: "[FROM.FROM.FROM.FROM.solar_system.GetName]星系的我方星门已遭破坏！"
 ariphaos_bypass.16.name: "星门获救"
 ariphaos_bypass.16.desc: "因未能维持星系控制权，维度乱流逐渐消散，星门功能得以保留。"
 ariphaos_bypass.17.name: "星门夺还"
 ariphaos_bypass.17.desc: "我们成功收复星系并保住了星门！"
 tech_ariphaos_gateway_ignore_cooldown: "跨亚空间冷却系统"
 tech_ariphaos_gateway_ignore_cooldown_desc: "通过将跃迁过程中的热能直接排放至亚空间，舰队能以全速状态完成跃迁。"
 tech_ariphaos_gateway_ignore_cooldown_desc_small: "穿越星门后免除速度惩罚。"
 tech_ariphaos_gateway_disruption: "星门过载"
 tech_ariphaos_gateway_disruption_desc: "该技术通过操纵星门自身的维度扭曲实现过载运行。若不加以抑制，由此产生的体空间震荡将摧毁建筑结构，切断其与星门网络的连接。"
 tech_ariphaos_gateway_disruption_desc_small: "允许在被占领星系切断星门网络连接。"
 ariphaos_gateway_ruined_temp: "$gateway_ruined$"
 ariphaos_gateway_ruined_temp_DESC: "$gateway_ruined_DESC$"
 ariphaos_gateway_ruined_temp_2: "$gateway_ruined$"
 ariphaos_gateway_ruined_temp_2_DESC: "$gateway_ruined_DESC$"
 ariphaos_gateway_restored: "$gateway_final$"
 ariphaos_gateway_restored_DESC: "$gateway_final_DESC$"