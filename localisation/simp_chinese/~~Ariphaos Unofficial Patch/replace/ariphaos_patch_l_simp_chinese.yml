 progress.3.desc_gaia: "我们的殖民船缓缓降落在§Y[Root.GetName]§!的一条大河谷里。每一处美景都令人叹为观止，有关美景的报道铺天盖地地出现在我们的网络上。\n\n这艘殖民船已被永久改造成新定居点的行政中心，其反应堆核心正在拆除，以便作为殖民地的临时动力源。\n\n随着殖民者开始大批登上外星世界的第一座[Root.Owner.GetSpeciesName]城市，数百只小帐篷和预制避难所如雨后春笋般出现在前殖民船的巨大船体周围。"
 progress.3.desc_relic: "我们的殖民船缓缓降落在§Y[Root.GetName]§!结构相对健全且空旷的平台上。虽然有类似植物的东西开始重新占领这个世界，但它并不真正符合食物的定义。这里还有无边无际的可用水库，不管怎么说，这儿不缺乏可用的庇护所。\n\n这艘殖民船已被永久改造成新定居点的行政中心，其反应堆核心正在拆除，以便作为殖民地的临时动力源。\n\n随着殖民者开始大量下船，这艘前殖民船的巨大船体周围的瓦砾中被开辟出了无数条路径————这是外星世界上的第一座[Root.Owner.GetSpeciesName]城市。"
 progress.3.desc_city: "我们的殖民船缓缓降落在§Y[Root.GetName]§!上的一个又一个专为此目的而设的平台。广阔的城市景观不提供任何营养，但巨大的水库提供了现成的水源。\n\n这艘殖民船已被永久改造成新定居点的行政中心，其反应堆核心正在拆除，以便作为殖民地的临时动力源。\n\n从船上下来执行各种功能的殖民者正在占领数百座建筑物，这是外星世界上的第一座[Root.Owner.GetSpeciesName]城市。"
 progress.3.desc_nuked: "我们的殖民船缓缓降落在§Y[Root.GetName]§!上相对茂盛的平原中。附近有一定数量的植被，还有相对干净的水源，不过水是通过船上的过滤器输送的，因为首先要去除放射性物质。\n\n这艘殖民船已被永久改造成新定居点的行政中心，其反应堆核心正在拆除，以便作为殖民地的临时动力源。\n\n随着殖民者开始大批登上外星世界的第一座[Root.Owner.GetSpeciesName]城市，数百只小帐篷和预制避难所如雨后春笋般出现在前殖民船的巨大船体周围。"
 progress.3.desc_habitat: "我们的殖民船已经巧妙地对接了§Y[Root.GetName]§!。殖民者们正在小心翼翼地探索居住站的内部，确保能找到什么资源，并学习如何利用居住站的水源。\n\n这艘船正在慢慢地从内到外被拆解，巨大气闸附近的一座临时建筑正在变成新定居点的行政总部，而这艘船的反应堆核心正在被拆除，以便它可以作为殖民地的临时动力源。\n\n随着殖民者开始大量登陆，数百个预制避难所和帐篷填满了建筑的凹处——这是外星平台上的第一座[Root.Owner.GetSpeciesName]城市。"
 progress.3.desc_ringworld: "我们的殖民船缓缓降落在§Y[Root.GetName]§!上适宜的平坦地形中。每处美景都令人叹为观止，无论如何操控，都抑制不住关于这里的报道铺天盖地出现在我们的网络上。\n\n这艘殖民船已被永久改造成新定居点的行政中心，其反应堆核心正在拆除，以便作为殖民地的临时动力源。\n\n随着殖民者开始大量登陆，数百个小帐篷和预制避难所在这艘前殖民船巨大的船体周围拔地而起————这是一个难以置信的广阔环形世界上的第一座[Root.Owner.GetSpeciesName]城市。"
 progress.3.desc_other: "我们的殖民船缓缓降落在§Y[Root.GetName]§!。外星环境充满挑战，但我们的殖民者坚持不懈。\n\n这艘殖民船已被永久改造成新定居点的行政中心，其反应堆核心正在拆除，以便作为殖民地的临时动力源。\n\n随着殖民者开始大批登上外星世界的第一座[Root.Owner.GetSpeciesName]城市，数百只小帐篷和预制避难所如雨后春笋般出现在前殖民船的巨大船体周围。"

