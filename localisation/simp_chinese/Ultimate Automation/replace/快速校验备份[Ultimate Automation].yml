  lazy_out_sta_events.2.desc: "Enabling this automation will make a new button appear on the left side of the screen whenever a starbase is selected. When the button is clicked, a menu will appear with multiple options to automatically outfit the starbases with a predefined template. This takes into account any cost reductions, however, not build time reductions (which will be implemented in the future)."

