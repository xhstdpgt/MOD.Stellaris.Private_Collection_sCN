l_english:
  #Event titles and desctiptions
  lazy_config_events.1.name: "Ultimate Automation"
  lazy_config_events.1.desc: "Click the middle of an automation feature's yellow button to enable it (the button will then become greyed out). Click the cross to its left to disable it, and the gear to its right to configure it (plus some info)."

  lazy_config_events.2.name: "Ultimate Automation"
  lazy_config_events.2.desc: "Use the arrow to the right to speed up the automations (x10) and the arrow to the left to change it back to normal (x1)."

  lazy_config_events.3.name: "Auto Pop Migration"
  lazy_config_events.3.desc: "Enabling this automation will automatically resettle pops based on the chosen settings below. \n\nNote: Unemployed pops to free jobs resettles to planets that have free jobs at the usual cost. Newly colonised planets will not be effected for 5 years to give it some development time/buffer."

  lazy_config_events.4.name: "Auto Construct Megastructures"
  lazy_config_events.4.desc: "Enabling this automation will make a new button appear on the left side of the screen whenever a construction ship is selected. The button will make the construction ship automatically construct megastructures but only the one that was selected in the settings menu, as many as it's allowed (capped)."

  lazy_config_events.5.name: "Auto Fleet Attack"
  lazy_config_events.5.desc: "Enabling this automation will make a new button appear on the left side of the screen whenever a fleet is selected. The button will make the selected fleet automatically attack the nearest enemy and/or bombard planets with the bombardment stance selected from the settings below."

  lazy_config_events.6.name: "Auto Recruit Armies"
  lazy_config_events.6.desc: "Enabling this automation will automatically recruit the chosen army (from below) on every owned planet until disabled. This takes army cost reductions into account but not recruitment speed."

  lazy_config_events.7.name: "Auto Fleet and Army Merger"
  lazy_config_events.7.desc: "Enabling this automation will automatically merge fleet and/or armies that were present (built) at the time of this being enabled. Therfore, this should be disabled after the merging has been completed."

  lazy_config_events.8.name: "Auto Colonisation"
  lazy_config_events.8.desc: "Enabling this automation will automatically build a colony ship and colonise the nearest planet with a chosen habitability or more (from below where the default is 70% or more)."

  lazy_config_events.9.name: "Auto Planet Destroyer"
  lazy_config_events.9.desc: "Enabling this automation will make all palnet destroyers automatically destroy the nearest hostile planet that is within a neighboring system.\n\nNote: this automation does not have a button on respective ships as there is a very small cap for the amount of planet destroyers an empire can field at a time."

  lazy_config_events.10.name: "Auto Army Invade"
  lazy_config_events.10.desc: "Enabling this automation will automatically set all armies to Aggressive Stance and invade hostile planets, if the odds of success are favorable."

  lazy_config_events.11.name: "Auto Terraforming"
  lazy_config_events.11.desc: "Enabling this automation will automatically terraform planets to the planet type that was chosen in the settings below. A planet type must be chosen and cost reductions and vanilla terraforming times are taken into account."

  lazy_config_events.12.name: "Auto Upgrade Starbases"
  lazy_config_events.12.desc: "Enabling this automation will automatically upgrade a starbase once per month from a specified level in the settings. All starbases can also be downgraded simultaneously from a specified level using the red options below. This takes into account any cost and time reductions.\n\nNote: Starbases should not be manually upgraded while this is active (upgrading queue invisible; look at countdown timer) and this will stop upgrading once the cap is hit!"

  lazy_config_events.13.name: "Auto Upgrade Megastructures"
  lazy_config_events.13.desc: "Enabling this automation will automatically upgrade megastructures (Gigastructures, NSC, and ACOT included).\n\nNote: this excludes the habitable stages of the matrioshka brain."

  lazy_config_events.14.name: "Auto Construct Outposts"
  lazy_config_events.14.desc: "Enabling this automation will make a new button appear on the left side of the screen whenever a construction ship is selected. The button will make the construction ship automatically construct outposts or waystations if you're a Nomadic empire."

  lazy_config_events.15.name: "Auto Colony Manager"
  lazy_config_events.15.desc: "Enabling this automation will make a new button appear on the left side of the screen whenever a planet is selected. The button will make the Auto colony Manager menu pop up with planetary automation options."

  lazy_config_events.16.name: "Auto Recruit Leaders"
  lazy_config_events.16.desc: "Enabling this automation will automatically recruit leaders for the chosen assignments."

  lazy_config_events.17.name: "Auto Outfit Starbases"
  lazy_config_events.17.desc: "Enabling this automation will make a new button appear on the left side of the screen whenever a starbase is selected. When the button is clicked, a menu will appear with multiple options to automatically outfit the starbases with a predefined template. This takes into account any cost and time reductions.\n\nNote: Starbases should not be manually outfitted while this is active (upgrading queue invisible; look at countdown timer)."

  lazy_config_events.18.name: "Auto Upgrade Deep Space Citadels"
  lazy_config_events.18.desc: "Enabling this automation will automatically upgrade a Deep Space Citadel once per month. This takes into account any cost and time reductions.\n\nNote: Deep Space Citadels should not be manually upgraded while this is active (upgrading queue invisible; look at countdown timer)."

  lazy_config_events.04.desc: "Please select a megastructure in the 'Auto construct megastructures' settings menu before pressing this button again."

  edict_edict_lazy_menu: "§GUltimate Automation§!"
  edict_edict_lazy_menu_desc: "Show the game start menu where options can be disabled, enabled, and configured (if the UI button does not show up)."

