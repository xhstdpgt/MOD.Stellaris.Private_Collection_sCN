l_simp_chinese:
  #活动标题与描述
  lazy_config_events.1.name: "Ultimate Automation \n终极自动化"
  lazy_config_events.1.desc: "点击自动化功能黄色按钮中部可启用该功能（按钮将变为灰色）。点击左侧叉号可禁用，点击右侧齿轮可进行配置（并查看相关信息）。"

  lazy_config_events.2.name: "Ultimate Automation \n终极自动化"
  lazy_config_events.2.desc: "使用右侧箭头可加速自动化进程（10倍速），左侧箭头可恢复常规速度（1倍速）。"

  lazy_config_events.3.name: "自动失业人口迁移"
  lazy_config_events.3.desc: "启用此自动化功能后，系统将根据下方选定设置自动重新安置人口。\n\n注意：失业人口向空闲岗位的迁移将按常规成本结算至有空闲岗位的星球。新殖民星球在5年内不受影响，以确保其发展时间/缓冲期。"

  lazy_config_events.4.name: "自动建设巨构"
  lazy_config_events.4.desc: "启用此自动化功能后，当选中选择工程船时，屏幕左侧将出现新按钮。该按钮将使工程船自动建造巨构建筑，但仅限设置菜单中选定的类型，且建造数量受上限限制。"

  lazy_config_events.5.name: "自动舰队攻击"
  lazy_config_events.5.desc: "启用此自动化功能后，当选中选择舰队时，屏幕左侧将出现新按钮。该按钮将使选定舰队自动攻击最近敌军和/或根据下方设置中选择的轰炸姿态对星球实施轨道轰炸。"

  lazy_config_events.6.name: "自动征募陆军"
  lazy_config_events.6.desc: "启用此自动化功能后，系统将在所有自有星球上自动征募选定陆军（从下方选择），直至功能关闭。此功能会考虑陆军成本减免，但不影响征募速度。"

  lazy_config_events.7.name: "自动 舰队/陆军 合并"
  lazy_config_events.7.desc: "启用此自动化功能后，将自动合并当前已存在（已建造）的舰队和/或军队。因此，在合并完成后应禁用此功能。"

  lazy_config_events.8.name: "自动殖民"
  lazy_config_events.8.desc: "启用此自动化功能后，将自动建造殖民船并殖民最近的可居住度达到所选值或更高的行星（默认设置为70%及以上）。"

  lazy_config_events.9.name: "自动摧毁行星"
  lazy_config_events.9.desc: "启用此自动化功能后，所有的巨像将自动摧毁邻近星系内最近的敌对行星。\n\n注意：该自动化功能未在相应舰船上设置按钮，因为帝国可同时部署的巨像数量存在极低上限。"

  lazy_config_events.10.name: "自动陆军入侵"
  lazy_config_events.10.desc: "启用此自动化功能后，若胜算较高，所有舰队将自动切换为侵略姿态并攻占敌对行星。"

  lazy_config_events.11.name: "自动环境改造"
  lazy_config_events.11.desc: "启用此自动化功能后，将根据下方设置中选定的行星类型自动进行环境改造。必须选择行星类型，系统将综合考虑成本削减及标准环境改造时长。"

  lazy_config_events.12.name: "自动升级恒星基地"
  lazy_config_events.12.desc: "启用此自动化功能后，将根据设置中指定的等级每月自动升级一次恒星基地。所有恒星基地也可通过下方的红色选项从指定等级同时降级。此过程会考虑任何成本和时间减免。\n\n注意：此功能启用期间请勿手动升级恒星基地（升级队列不可见，请查看倒计时器），且达到上限后将停止升级！"

  lazy_config_events.13.name: "自动升级巨构"
  lazy_config_events.13.desc: "启用此自动化功能后，将自动升级巨构（包括更多巨构和NSC模组的巨构）\n\n注意：这不包括巨构核心的可居住阶段。"

  lazy_config_events.14.name: "自动建造哨站"
  lazy_config_events.14.desc: "启用此自动化功能后，每当选中工程船时，屏幕左侧将显示新按钮。该按钮可使工程船自动建造前哨站或者说是驿站(如果你是游牧帝国的话)。"

  lazy_config_events.15.name: "自动殖民地管理"
  lazy_config_events.15.desc: "启用此自动化功能后，每当选择行星时，屏幕左侧将显示新按钮。该按钮将弹出自动殖民管理器菜单，其中包含行星自动化选项。"

  lazy_config_events.16.name: "自动招募领袖"
  lazy_config_events.16.desc: "启用此自动化功能后，将自动为所选任务招募领袖。"

  lazy_config_events.17.name: "自动装配恒星基地"
  lazy_config_events.17.desc: "启用此自动化功能后，每当选中恒星基地时，屏幕左侧将出现新按钮。点击该按钮将弹出菜单，提供多个选项以便使用预设模板自动装配恒星基地。该功能已考虑所有成本和时间削减因素。\n\n注意：此功能启用期间请勿手动配置恒星基地（升级队列不可见；请查看倒计时）。"

  lazy_config_events.18.name: "自动升级深空擎天堡"
  lazy_config_events.18.desc: "启用此自动化功能后，每月会自动升级一次深空擎天堡，并会考虑所有成本和时间减免。\n\n注意：此功能启用期间请勿手动升级深空擎天堡（升级队列不可见，请查看倒计时）。"

  # decision_lazy_planet: "自动行星专业化"
  # decision_lazy_planet_desc: "赋予行星自动专业化，将根据所选的选项自动建造建筑和区划。"

  # lazy_pla_spe_events.1.name: "行星自动建设"
  # lazy_pla_spe_events.1.desc: "赋予 §Y[Root.Planet.GetName]§! 自动专业化，根据所选的选项自动建造建筑。"

  lazy_config_events.04.desc: "请在'自动建造巨型结构'设置菜单中选择一个巨型结构，然后再按此按钮。"

  edict_edict_lazy_menu: "§G终极自动化§!"
  edict_edict_lazy_menu_desc: "显示游戏开始菜单，可在其中禁用、启用和配置选项（如果UI按钮未显示）。"

