l_simp_chinese:
 sm_ring_research_hub: "微重力研究实验室"
 sm_ring_research_hub_desc: "通过轻松访问微重力环境，行星研究人员能够更高效地工作。\n[mod] Orbital Ring Buildings"
 sm_ring_refinery_hub: "战略轨道资源仓库"
 sm_ring_refinery_hub_desc: "在轨基础设施通过降低基础设施成本，最大化战略资源的生产。\n[mod] Orbital Ring Buildings"
 mod_planet_researchers_minerals_upkeep_add: "£job_brain_drone£ $job_brain_drone_plural$ 的 £minerals£ $minerals$维护费"
 mod_planet_researchers_energy_upkeep_add: "£calculator£ $job_calculator_plural$ 的 £energy£$energy$维护费"
 sm_ring_coordination_system: "轨道协调系统"
 sm_ring_coordination_system_desc: "一个高效中继系统，保证了协调无人机与星球之间的即时通信，以及与其他星球上的无人机近乎即时的通信。\n[mod] Orbital Ring Buildings"
 ring_coordination_system_effect: "来自 £job_coordinator£ $job_coordinator_plural$的 £unity£ $unity$：§G+1§!"
 sm_organic_convenience_infrastructure: "有机便利基础设施"
 sm_organic_convenience_infrastructure_desc: "这个由太空电梯、低重力娱乐中心和高舒适度交通基础设施组成的广泛系统旨在为我们的活体陈设提供最大的便利。\n[mod] Orbital Ring Buildings"
 mod_planet_bio_trophies_unity_produces_add: "来自 £job_bio_trophy£ $job_bio_trophy_plural$的 £unity£ $unity$"
 sm_ring_surveillance_hub: "轨道监视中心"
 sm_ring_surveillance_hub_desc: "高分辨率监控望远镜、行为分析和预测算法以及快速执法单位部署基础设施使执法效率达到前所未有的水平。\n[mod] Orbital Ring Buildings"
 sm_orbital_ring_solar_panel_network: "太阳能板网络"
 sm_orbital_ring_solar_panel_network_desc: "一组太阳能板直接收集了原本会被轨道环阻挡的阳光。\n[mod] Orbital Ring Buildings"
 sm_orbital_ring_depot: "轨道基础设施仓库"
 sm_orbital_ring_depot_desc: "通过重新设计货运飞船，资源可以轻松地在行星表面分配。对于 2 吨或以上的订单，保证在 2 小时内送达。\n[mod] Orbital Ring Buildings"
 sm_orbital_ring_habitat: "轨道居住舱模块"
 sm_orbital_ring_habitat_desc: "在下方星球的正常重力中无法实现的庞大住房单位。一个广泛的高速太空电梯网络将其与地表上的每一个重要地点相连。\n[mod] Orbital Ring Buildings"
 ring_refinery_hub_effect: "来自 £job_chemist£ $job_chemist_plural$ 的 £volatile_motes£ $volatile_motes$：§G+0.5§!\n来自 £job_gas_refiner£ $job_gas_refiner_plural$ 的 £exotic_gases£ $exotic_gases$：§G+0.5§!\n来自£job_translucer£ $job_translucer_plural$ 的 £rare_crystals£ $rare_crystals$：§G+0.5§!\n来自 £job_chemist£ £job_gas_refiner£ £job_translucer£ 精炼厂的 £minerals£ $minerals$ 维护费：§R+5§!"
