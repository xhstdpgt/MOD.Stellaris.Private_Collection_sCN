 sm_starm_orbital_ring_imperial: "帝国监狱复合体"
 sm_starm_orbital_ring_imperial_desc: "作为帝国境内防御最严密的设施类型，这个帝国权威的象征环绕着行星，里面堆满了由众多执法者看守的监狱。\n[mod] Starbase Buildings and Modules."
 sm_starm_orbital_ring_imperial_effect: "行星效应： £job_enforcer£ 执法者岗位§G+5§!。帝国效果： £stability£ 稳定度§G+1§! £crime£ 犯罪率：§G-10%§! £mod_pop_government_ethic_attraction£ 政体思潮吸引力：§G+10%§! 加密和解密：§G+2§!。 §R失去“流放世界”修正或“星海霸业”国民理念会移除这些加成。§!"
 sm_starm_orbital_ring_prison: "轨道监禁模块"
 sm_starm_orbital_ring_prison_desc: "这些阴冷的轨道设施中的安全走廊将众多监禁区与发射平台连接起来，监狱驳船不断将囚犯运送到他们的强制劳动任务中，为流放地表面的劳动营腾出空间。\n[mod] Starbase Buildings and Modules."
 sm_starm_orbital_ring_prison_effect: "£job_enforcer£ 执法者岗位§G+2§! £housing£ 人口住房需求：§G-10%§! £building£ 建筑槽：§G+1§!. §R失去“流放地”修正会移除这些加成。§!"
 sm_starm_orbital_ring_resort: "游客中心"
 sm_starm_orbital_ring_resort_desc: "通过超高速穿梭机在靠港的客船和行星的度假胜地之间运送游客，我们几乎可以说能在不影响行星的独特自然奇观的情况下，绕过了地表建设开发禁令。\n[mod] Starbase Buildings and Modules."
 sm_starm_orbital_ring_resort_effect: "住房§G+20§!。§R失去“度假胜地”修正会移除此加成。§!"
 sm_starm_orbital_ring_casino: "轨道豪华度假酒店"
 sm_starm_orbital_ring_casino_desc: "这些豪华轨道区为统治精英提供了宽敞的娱乐空间和舒适的住房，并为那些负担得起的人提供各种可想象到的异国情调的娱乐活动。\n[mod] Starbase Buildings and Modules."
 sm_starm_orbital_ring_casino_effect: "£trade_value£ 贸易额§G+10§!。基于国民理念的 £pop_cat_ruler£ 统治者岗位§G+2§!和 £pop_cat_specialist£ 专家岗位§G+4§!。§R失去“度假胜地”修正将移除这些加成。§!\n"
 sm_starm_orbital_ring_commune: "轨道公社"
 sm_starm_orbital_ring_commune_desc: "这些服务中心平等地为来自银河系各地的游客提供统一而舒适的公共客房。\n[mod] Starbase Buildings and Modules."
 sm_starm_orbital_ring_commune_effect: "£trade_value£ 贸易额§G+10§!，住房§G+20§!，£job_politician£ 官僚岗位§G+1§!。§R失去“度假胜地”修正或“同甘共苦”国民理念将移除这些加成。§!\n"

