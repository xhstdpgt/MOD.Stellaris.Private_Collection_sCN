 EAC_TECH_UNLOCK_PATROL_CRAFT_2_CONSTRUCTION_DESC: "§H巡逻艇Ⅱ型§!\n巡逻艇Ⅱ型是改进型的行星防卫军舰船，未配备超光速驱动器，主要用于应对星系内的敌对接触，随时保持武装待命状态。 \n\n——[mod]At War：Planetary Defense Fleets 4.0"

