 # Starbase Defense Tech
 eac_aw_tech_repeatable_starbase_defense_platform_capacity_add: "星港防御算法"
 eac_aw_tech_repeatable_starbase_defense_platform_capacity_add_desc: "改进的控制算法增加了能有效控制的防御平台数量。\n[mod] At War：Starbase Improvements"

 # Station Defense
 eac_tech_space_defense_station_heavy_1: "小型化防御平台组件"
 eac_tech_space_defense_station_heavy_1_desc: "通过部件小型化，可以增加更厚的船体和额外炮塔点，打造出与现有防御平台相同形状和尺寸的重型防御平台。\n[mod] At War：Starbase Improvements"

 eac_tech_space_defense_station_heavy_hull_1: "改良重型$military_station_small$船体"
 eac_tech_space_defense_station_heavy_hull_1_desc: "增强冲击吸收能力的强化框架和爆反护盾，即使在巨大的压力下，也能保证重型平台的结构完整性。\n[mod] At War：Starbase Improvements"

 eac_tech_space_defense_station_heavy_hull_2: "先进重型$military_station_small$船体"
 eac_tech_space_defense_station_heavy_hull_2_desc: "最新的重型平台船体优化了结构完整性力场并改良了舱壁。\n[mod] At War：Starbase Improvements"
 
 eac_tech_large_gun_citadel: "大型火炮要塞"
 eac_tech_large_gun_citadel_desc: "配备大型火炮基座的要塞核心。\n[mod] At War：Starbase Improvements"


