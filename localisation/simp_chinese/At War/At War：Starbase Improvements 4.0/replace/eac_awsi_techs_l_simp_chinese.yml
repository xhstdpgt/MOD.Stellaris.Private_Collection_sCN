 eac_tech_space_defense_station_heavy_hull_3: "超重型$military_station_small$船体"
 eac_tech_space_defense_station_heavy_hull_3_desc: "最新的重型平台船体，具有优化的结构完整性力场和改进舱壁。\n[mod] At War：Starbase Improvements"
