 d_seismic_rift: "£blocker£ 地震裂缝"
 d_seismic_rift_desc: "一场毁灭性的地震把一大片城区一分为二。我们社会的最低阶层正在利用这种情况。"
 d_seismic_ruins: "£blocker£ 地震遗址"
 d_seismic_ruins_desc: "有记载的历史上最严重的地震之一夷平了这个大都市区的大片地区。被夷为平地的建筑外壳成了人渣和恶棍的避难所。"

 d_cracked_foundry: "破碎的铸造厂"
 d_cracked_foundry_desc: "这个星球曾经有一个巨大的地下铸造厂。然而板块平衡被打破，整个星球被火山吞噬。"


