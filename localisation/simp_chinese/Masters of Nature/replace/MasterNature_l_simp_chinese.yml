 # 行星修正器
 ###################################################
 
 pm_subterranean_construction: "地下工程"
 pm_subterranean_construction_desc: "我们正在进行大规模的挖掘工程，以扩大我们的地下殖民地。公告--我们不对轻微地震或天坑负责，在此居住，风险自担。\n[mod] Masters of Nature"

 pm_subterranean_fortress: "地下要塞"
 pm_subterranean_fortress_desc: "由加固掩体和人工洞穴组成的庞大网络可保护关键人员免受伤害。\n[mod] Masters of Nature"

 pm_subterranean_foundry: "地下铸造厂"
 pm_subterranean_foundry_desc: "以行星核心的热量为动力的生产锻造厂。排气时略有波动，引发全球大火的风险极低。\n[mod] Masters of Nature"

 pm_subterranean_refinery: "地下精炼厂"
 pm_subterranean_refinery_desc: "地下加工厂，将提炼的稀有化合物直接输送到行星地表的工业。多余的材料被排放到空气中，使当地人有更多的时间呆在室内。\n[mod] Masters of Nature"

 pm_subterranean_lab: "地下实验室"
 pm_subterranean_lab_desc: "拥有各种各样的磁铁和线圈，可以用来将物体以超高速撞击到其他物体上，并且有几乎用不完的烧杯。\n[mod] Masters of Nature"

 pm_sky_construction: "空中建设"
 pm_sky_construction_desc: "一座巨大的脚手架支撑着一座漂浮的城市。这个违背物理学原理的建筑让人们心生敬畏。\n[mod] Masters of Nature"

 pm_sky_mall: "空中商城"
 pm_sky_mall_desc: "资本主义的顶峰漂浮在这个星球之上。可以在所有行星运输舱的后座仓里找到它的销售目录。\n[mod] Masters of Nature"

 pm_sky_green: "空中花园"
 pm_sky_green_desc: "在我们田园诗般的浮岛上享受空中假期，这里的景色美不胜收。\n[mod] Masters of Nature"

 pm_sky_estate: "空中庄园"
 pm_sky_estate_desc: "最富有的人们在镶满珠宝的空中浮岛上过着隐居的生活。99% 的人认为这不公平。\n[mod] Masters of Nature"

 pm_sky_roost: "空中栖息地"
 pm_sky_roost_desc: "一个田园诗般的空间，在蜂巢的注视下，幼鸟成长的田园空间。\n[mod] Masters of Nature"

 pm_sky_factory: "空中装配厂"
 pm_sky_factory_desc: "一个完全不具威胁性的、具有自我意识的机器人组装厂。只要别让它停止制造机器人就行。\n[mod] Masters of Nature"


 pm_fine: "不满"
 pm_fine_desc: "我们的人民对我们没有注意到他们的问题感到不安。这很好。"
 pm_ban_demonstrations: "禁止示威活动"
 pm_ban_demonstrations_desc: "3人或3人以上的公众集会将被判5年铸造劳役"
 pm_subterranean_foundry_investigation: "铸造厂的调查"
 pm_subterranean_foundry_investigation_desc: "如果不是这些爱打听的调查人员，我们可以做更多的工作。这里没有问题，往前走。"
 pm_subterranean_foundry_closed: "地下铸造厂：封锁"
 pm_subterranean_foundry_closed_desc: "由于恐惧和谣言，铸造厂被关闭。可能会通过决议重新启动"
 pm_subterranean_foundry_safe: "地下铸造厂：安全"
 pm_subterranean_foundry_safe_desc: "生产合金的动力来自行星核心的热量。安全协议启用，全球无火灾危险。"
 pm_legal_action: "采取法律行动"
 pm_legal_action_desc: "我们的公民愚蠢地决定就所谓的“大规模死亡和破坏”对国家提起诉讼。“所有物种一踏上我们的世界，就会本能地同意签署《最终用户生存协议》(EULA)。该协议明确指出，国家不对任何形式的大规模死亡或由此造成的损失负责。"
 pm_subterranean_foundry_destroyed: "损失铸造厂"
 pm_subterranean_foundry_destroyed_desc: "曾经，由行星核心的热量驱动的锻铁在这里工作，直到接近灾难的时候把整个星球都压垮了。现在它们只是一个空壳"
 pm_impending_doom: "即将到来的末日"
 pm_impending_doom_desc: "行星外壳正在破碎。如果不尽快采取措施 整个星球都可能断裂。§R如果破坏力达到100%，星球将会裂开。§!"
 pm_fracture: "地壳断裂"
 pm_fracture_desc: "第二道铸造裂缝已经浮出水面，行星外壳正在加速破碎。没有希望了吗？"
 pm_ash_cloud: "火山灰云"
 pm_ash_cloud_desc: "一股过热的碎屑喷向高空的大气层，它会在未来几年里遮住太阳。"
 pm_ash_cloud_gestalt: "$pm_ash_cloud$"
 pm_ash_cloud_gestalt_desc: "$pm_ash_cloud_desc$"


