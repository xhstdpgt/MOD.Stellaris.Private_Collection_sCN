 ###################################################
 # 行星决议
 ###################################################

 decision_subterranean_construction: "地下城市"
 decision_subterranean_construction_desc: "我们需要给我们的人民更多的空间。规划一个地下大都市。 \n§Y提供额外的资源、科学或防御§! \n对更大的星球更有效。\n[mod] Masters of Nature"
 decision_sky_construction: "天空岛"
 decision_sky_construction_desc: "我们将生活在天空中，看不起我们下面的人，不管付出什么代价。 \n§Y提供额外的贸易、人口增长、凝聚力或影响力§! \n对较小的星球更有效。\n[mod] Masters of Nature"
 
 subterranean_city_unlock: "§H解锁决议:§! §E$decision_subterranean_construction$§!"
 subterranean_city_effect: "提供额外的区划、星球加成及工作岗位。对更大的星球更有效。"
 sky_island_unlock: "§H解锁决议:§! §E$decision_sky_construction$§!"
 sky_island_effect: "提供额外的区划、星球加成及工作岗位。对更小的星球更有效。"
 
 decision_subterranean_expansion: "地下扩张"
 decision_subterranean_expansion_desc: "扩大我们的地下城市。比上次扩张少增加1个区划，提供额外的地下工作岗位，但不会改变行星的地下城修正。"
 decision_subterranean_expansion_2: "最终地下城市扩张"
 decision_subterranean_expansion_2_desc: "$decision_subterranean_expansion_desc$"
 
 decision_sky_expansion: "天空岛扩张"
 decision_sky_expansion_desc: "扩大我们的天空岛。增加区划比上次扩张少1，提供额外的天空岛工作岗位，但不会改变行星的天空岛修正。"
 decision_sky_expansion_2: "最终天空岛扩建"
 decision_sky_expansion_2_desc: "$decision_sky_expansion_desc$"
 
 decision_reopen_foundry: "重开铸造厂"
 decision_reopen_foundry_desc: "关闭铸造厂是一个激进的政策，是时候再次打开它的大门了。"
 decision_investigate_foundry: "$foundry_investigation$"
 decision_investigate_foundry_desc: "$foundry_investigation_desc$"
 decision_safety_protocols: "启用安全协议"
 decision_safety_protocols_desc: "铸造厂的运行有一定风险导致行星解体。我们已经采取了简单的措施来确保星球的安全，包括强制性的2小时午休。"
 decision_disable_protocols: "禁用安全协议"
 decision_disable_protocols_desc: "生产配额远比工人安全重要。\n\n§Y有地震扰动的危险。每当星球发生地震时，灾难性§R行星断裂§Y的几率就会增加。§!"

 ###################################################
 # 特别项目
 ###################################################
 foundry_investigation: "调查地震干扰"
 foundry_investigation_desc: "我们必须确定最近的地震和铸造作业之间是否有任何联系。这种联系纯粹是一种推测，而这项研究绝不是对犯罪或责任的承认。所有人通过最终用户生活协议(EULA)在此居住，放弃了他们采取法律行动的权利。"
 foundry_investigation_DESC: "$foundry_investigation_desc$"
 research_fracture: "起草解决铸造断裂危机的方案"
 research_fracture_desc: "怎么会这样呢?我们能做什么?所有的希望都破灭了吗?没有主意就是坏主意，我们必须想出一个行动计划。"
 research_fracture_DESC: "$research_fracture_desc$"
 seal_fracture: "封堵裂缝"
 seal_fracture_desc: "从理论上讲，我们可以尝试使用地下共振发射器，努力将断裂的行星地壳摇回原位。如果你愿意，这是一场反向地震。它需要极其详细的传感器读数、大量的电力支出和相当大的运气。如果成功的话，我们可以让[Root.Planet.GetName]恢复到灾难发生前的状态，也许有一天我们甚至可以重建我们的地下复合体，并加固它以应对未来的失败。成功的机会§Y很大§!。"
 seal_fracture_DESC: "$seal_fracture_desc$"
 contain_fracture: "控制裂缝"
 contain_fracture_desc: "我们将尽力控制损失。如果我们用足够的材料封住每一个表面裂缝，并引爆一系列集中的炸药，使原来的铸造主腔坍塌，我们也许能够在原来的核心安全壳破裂蔓延到整个表面之前堵住它。不幸的是，这对灰云没有任何帮助，[Root.Planet.GetName]也不会再和以前一样了。成功的机会§R不大§!。"
 contain_fracture_DESC: "$contain_fracture_desc$"
 ignore_fracture: "使损失减少到最少"
 ignore_fracture_desc: "在[Root.Planet.GetName]上起作用的力量对我们来说是难以控制的。我们所能做的最好的事情就是关闭我们还能到达的锻铁部分，让自然顺其自然。成功的机会§R很小§!。"
 ignore_fracture_DESC: "$ignore_fracture_desc$"
 
 masterclearance_increase_size_0: "增加最大地区§R0§!。\n$TIME_DELAY$."
 masterclearance_increase_size_1: "增加最大地区§G1§!。\n$TIME_DELAY$."
 masterclearance_increase_size_2: "增加最大地区§G2§!。\n$TIME_DELAY$."
 masterclearance_increase_size_3: "增加最大地区§G3§!。\n$TIME_DELAY$."
 masterclearance_increase_size_4: "增加最大地区§G4§!。\n$TIME_DELAY$."
 
 land_clearance_first: "§R在我们考虑这么大的工程之前，我们应该先把它建在开阔的土地上。§!"
 one_percent_already: "我们社会中最富有的人已经有了家。他们要求再也不要被打扰。"
 land_clearance_construction_first: "§R我们的顶尖工程师已经在忙于一项重大建设工程。这样一个雄心勃勃的项目，你们需要我们最好的工程师，是吗?§!"
 
 ban_already: "没有什么可以禁止的了"
 investigation_already: "我们已经发布了一个特别的项目来调查地震扰动和铸造之间未经证实的联系。两者之间具有联系这一说法还未得到证实。这很好。"
 safety_cooldown: "我们每六个月内只能改变一次安全规程。否则会很混乱"

 decision_mastery_of_specialists: "聚焦专家"
 decision_mastery_of_specialists_desc: "专家特权，对劳工不利"
 decision_mastery_of_workers: "聚焦劳工"
 decision_mastery_of_workers_desc: "劳工特权，对专家不利"
 
 planet_projects: "行星决议"

