 MasterNature.1.name: "[Root.Planet.GetName]地下综合体计划"
 MasterNature.1.desc: "我们的大工程正在进行中!虽然一些居民抱怨当地的震动和地面位移,偶尔崩溃街区是一个小进步的代价。现在，我们的地下城市应该变成什么样子呢? \n\n我们的将军们提出了一个几乎密不透风的地下堡垒和足够的食物和庇护的能力更重要的社会成员应该受到轨道轰炸我们的世界。然而，我们的工程主管提出了一个完全利用的地热铸造，可以彻底改变行星的生产方法。 \n\n一些边缘环保组织反对这一想法，理由是破坏星球构造可能会带来无法预料的后果，而当地的工匠团体代表则请愿称，这些锻工厂的硫磺烟雾会毁掉他们的嗅觉艺术品。然而，这些反对者并不重要，那么我们应该建设什么?"

 MasterNature.fortress.name: "打开地下堡垒"
 MasterNature.fortress.tooltip: "防守是最好的防守。 \n\n§H$ON_COMPLETION$:§! \n\n§E行星修正:§! \n$MOD_PLANET_ORBITAL_BOMBARDMENT_DAMAGE$ §G-20%§! \n$MOD_ARMY_DAMAGE_MULT$ §G+50%§! \n\n§E新岗位:§! \n每 50 £pop£ £mod_job_subterranean_soldier_add£ $job_subterranean_soldier$ §G+1§! \n$job_subterranean_soldier_effect_desc$"
 MasterNature.fortress_expanded.tooltip: "防守是最好的防守。 \n\n§H$ON_COMPLETION$:§! \n每 50 £pop£ £mod_job_subterranean_soldier_add£ $job_subterranean_soldier$ §G+1§! \n$job_subterranean_soldier_effect_desc$"
 MasterNature.2.name: "地下堡垒完成,[Root.Planet.GetName]保证"
 MasterNature.2.desc: "我们伟大的挖掘工程已经完成。这标志着[Root.Planet.GetName]的一个新时代，成千上万的我们的公民现在可以活到他们的一辈子从来没有见过太阳。有些人可能仍然应该外出，但重要的是他们不再需要了。\n\n当地军事指挥官夸口说，堡垒的防爆门可以承受战舰主炮直射。在我们的舰队司令提出将亲自测试这一理论后，他们马上就闭上了嘴。但毫无疑问，如果任何攻击破坏了我们的大气层，最安全的地方是地下。"
 MasterNature.fortress2.name: "打开防爆门"
 MasterNature.fortress2.tooltip: "收回你的主炮射击命令，舰队司令。 \n\n每 50 £pop£ £mod_job_subterranean_soldier_add£ $job_subterranean_soldier$ §G+1§! \n$job_subterranean_soldier_effect_desc$ \n\n§E$NEW_DISTRICTS$§!"

 MasterNature.foundry.name: "建立一个伟大的铸造厂"
 MasterNature.foundry.tooltip: "挖得太深，太贪婪了。 \n\n§H$ON_COMPLETION$:§! \n\n§E行星修正:§! \n£alloys£ $alloys$ §G+50%§! \n$MOD_POP_ENVIRONMENT_TOLERANCE$ §R-20%§! \n\n§E新岗位:§! \n每 50 £pop£ £mod_job_subterranean_foundry_add£ $job_subterranean_foundry$ §G+1§! \n$job_subterranean_foundry_effect_desc$"
 MasterNature.foundry_expanded.tooltip: "挖得太深，太贪婪了。 \n\n§H$ON_COMPLETION$:§! \n每 50 £pop£ £mod_job_subterranean_foundry_add£ $job_subterranean_foundry$ §G+1§! \n$job_subterranean_foundry_effect_desc$"
 MasterNature.foundry_safe.tooltip: "挖得太深，太贪婪了。 \n\n§H$ON_COMPLETION$:§! \n\n§E行星修正:§! \n£alloys£ $alloys$ §G+15%§! \n\n§E新岗位:§! \n每 50 £pop£ £mod_job_subterranean_foundry_add£ $job_subterranean_foundry$ §G+1§! \n$job_subterranean_foundry_effect_desc$"
 MasterNature.3.name: "地下铸造厂让[Root.Planet.GetName]再次伟大"
 MasterNature.3.desc: "我们的大工程完成了。岩浆锻造厂正满负荷运转，舰队指挥部正急切地订购一批新的锻造厂型巡洋舰，预计当地造船厂将无法跟上新涌入的矿物的步伐。\n\n不出所料，当地的艺术团在铸造厂入口附近发动了一场全面的嗅觉抗议，他们戴着似乎是防毒面具的东西以示团结。然而，最新的时事通讯称“手工抗议”是他们的下一个大项目，所以很难认真对待这种滑稽行为。工程报告说，铸造完整性在预期参数之内，居民几乎肯定是安全的。"
 MasterNature.foundry2.name: "几乎可以肯定?"
 MasterNature.foundry2.tooltip: "至少地震不会影响我的天空岛。 \n\n每 50 £pop£ £mod_job_subterranean_foundry_add£ $job_subterranean_foundry$ §G+1§! \n$job_subterranean_foundry_effect_desc$ \n\n§E$NEW_DISTRICTS$§!"
 MasterNature.foundry2_safe.tooltip: "至少地震不会影响我的天空岛。 \n\n每 50 £pop£ £mod_job_subterranean_foundry_add£ $job_subterranean_foundry$ §G+1§! \n$job_subterranean_foundry_effect_desc$ \n\n§E$NEW_DISTRICTS$§!"

 MasterNature.refinery.name: "建造一个地下精炼厂"
 MasterNature.refinery.tooltip: "化学家有所有的解决方案。 \n\n§H$ON_COMPLETION$:§! \n\n§E行星修正:§! \n建筑 £volatile_motes£ £exotic_gases£ £rare_crystals£ 维护费 §G-20%§!  \n$MOD_POP_HOUSING_USAGE_MULT$ §R+5%§! \n\n§E新岗位:§! \n每 50 £pop£ £mod_job_subterranean_refiner_add£ $job_subterranean_refiner$ §G+1§! \n$job_subterranean_refiner_effect_desc$"
 MasterNature.refinery_expanded.tooltip: "化学家有所有的解决方案。 \n\n§H$ON_COMPLETION$:§! \n每 50 £pop£ £mod_job_subterranean_refiner_add£ $job_subterranean_refiner$ §G+1§! \n$job_subterranean_refiner_effect_desc$"
 MasterNature.refinerybuilt.name: "当精炼厂在[Root.Planet.GetName]上打开通风口时，当地人感到愤怒"
 MasterNature.refinerybuilt.desc: "我们巨大的地下化工后处理工厂已经建成。它利用深埋在地壳下的巨大的热和压力来提炼最稀有的晶体、最奇特的异星天然气和危险的易爆微粒，其过程与使这些元素自然出现的过程完全相同，只是速度快得多。它可以将这些原材料直接输送到生产或生产过程中使用它们的行星侧工业。多余的物质通过表面管道排出，这种做法可能是完全安全的，至少根据我们出钱进行研究的科学家的说法是如此。 \n\n虽然没有证据表明与精炼厂有联系，[Root.Planet.GetName]居民却越来越不愿意出门，理由是空气质量差。这可能只是社会中生产率较低的成员要求扩大居住空间的借口。此外，还发生了几起孤立的“红血管病”事件，据称是由于接触了精炼过程的一种副产品——高浓度的尘埃所致。法律专家向我们保证，由于高效的合同法，精炼厂不承担任何责任。真正的悲剧是，我们正在浪费宝贵的尘埃，粗心的工人可能会不小心吸入或以其他方式吸收这些尘埃。精炼厂已经制定了“屏住呼吸”的规定，但到目前为止，工人们还不愿意合作。"
 MasterNature.refinerybuilt2.name: "呼吸也成了一种奢求"
 MasterNature.refinerybuilt2.tooltip: "防毒面具:最新的时尚潮流。 \n\n每 50 £pop£ £mod_job_subterranean_refiner_add£ $job_subterranean_refiner$ §G+1§! \n$job_subterranean_refiner_effect_desc$ \n\n§E$NEW_DISTRICTS$§!"

 MasterNature.lab.name: "建造一个研究实验室"
 MasterNature.lab.tooltip: "我们保证不把一切都炸毁。 \n\n§H$ON_COMPLETION$:§! \n\n§E行星修正:§! \n£job_researcher£ $job_researcher_plural$ 产出的£physics_research£和£engineering_research£ §G+1§! \n$mod_planet_researchers_upkeep_mult$ §R+20%§! \n\n§E新工作:§! \n每 50 £pop£ £mod_job_subterranean_researcher_add£ $job_subterranean_researcher$ §G+1§! \n$job_subterranean_researcher_effect_desc$"
 MasterNature.lab_gestalt.tooltip: "我们保证不把一切都炸毁。 \n\n§H$ON_COMPLETION$:§! \n\n§E行星修正:§! \n£job_researcher£ $job_researcher_plural$ 产出的 £physics_research£和£engineering_research£ §G+1§! \n$mod_planet_researchers_upkeep_mult$ §R+20%§! \n\n§E新岗位:§! \n每 50 £pop£ £mod_job_subterranean_researcher_drone_add£ $job_subterranean_researcher_drone$ §G+1§! \n$job_subterranean_researcher_drone_effect_desc$"
 MasterNature.lab_expanded.tooltip: "我们保证不把一切都炸毁。 \n\n§H$ON_COMPLETION$:§! \n每 50 £pop£ £mod_job_subterranean_researcher_add£ $job_subterranean_researcher$ §G+1§! \n$job_subterranean_researcher_effect_desc$"
 MasterNature.lab_gestalt_expanded.tooltip: "我们保证不把一切都炸毁。 \n\n§H$ON_COMPLETION$:§! \n每 50 £pop£ £mod_job_subterranean_researcher_drone_add£ $job_subterranean_researcher_drone$ §G+1§! \n$job_subterranean_researcher_drone_effect_desc$"
 MasterNature.labbuilt.name: "地下实验室吸引着疯狂的[Root.Planet.GetName]科学家"
 MasterNature.labbuilt.desc: "我们庞大的地下研究实验室已经对外开放。这是一个物理学家名副其实的游乐场,它包含各种磁铁和线圈，用于以超高速将东西砸向其他东西，用于保存各种类型的有机物的令人毛骨悚然的罐子，以及数量惊人的烧杯。来自已知银河系最远的地方都提出了使用这些设施的拨款申请和要求。\n\n一个雄心勃勃的高能实验计划有望极大地提高我们对物理学和工程学的理解。一些反对者警告说，我们正在搞乱我们还不了解的宇宙的一部分，我们可能会意外地炸毁世界或创造一个黑洞。这种批评在很大程度上被忽视了，或者偶尔，它点燃了对创造局部黑洞的可能性的兴奋讨论......我们的科学家似乎对这些东西感到高兴而不是恐惧。"
 MasterNature.labbuilt2.name: "我相信他们知道自己在做什么"
 MasterNature.labbuilt2.tooltip: "你永远不会有足够的烧杯。 \n\n每 50 £pop£ £mod_job_subterranean_researcher_add£ $job_subterranean_researcher$ §G+1§! \n$job_subterranean_researcher_effect_desc$ \n\n§E$NEW_DISTRICTS$§!"
 MasterNature.labbuilt2_gestalt.tooltip: "你永远不会有足够的烧杯。 \n\n每 50 £pop£ £mod_job_subterranean_researcher_drone_add£ $job_subterranean_researcher_drone$ §G+1§! \n$job_subterranean_researcher_drone_effect_desc$ \n\n§E$NEW_DISTRICTS$§!"

 MasterNature.sky.name: "[Root.Planet.GetName]推出了天空之城"
 MasterNature.sky.desc: "当我们很久以前向星空出发时，[Root.Planet.GetName]上最后一个未被触及的生活空间的角落位于杂乱的地面和巨大的太空之间。今天，科学家说，我们可以居住在我们的祖先认为是众神家园的地方。\n\n关于这个云端城市可能是什么，有很多梦想。商人、贸易商和企业代表提出的空中购物中心，被描述为一个非常有利可图的企划。一个当地活动组织“为了更好的明天”的成员发布了一个空中绿地的计划，一个所有公民都可以进入的理想主义天堂。最后，一群自诩为光荣的1%的特别富有的人提出了一系列的私有空中庄园，将他们与肮脏的大众隔离开来。他们承诺增加对政府的支持，然而这样的精英主义行为无疑会导致社会冲突。我们应该建造什么？"

 MasterNature.skymall.name: "建造一个闪亮的天空商城"
 MasterNature.skymall.tooltip: "步骤1：建岛\n步骤2：? ?\n步骤3：获得利润。 \n\n§H$ON_COMPLETION$:§! \n\n§E行星修正:§! \n$MOD_TRADE_VALUE_MULT$ £mod_trade_value_mult£ §G+25%§! \n$mod_planet_pops_consumer_goods_upkeep_mult$ £mod_consumer_goods_upkeep_mult£ §R+5%§! \n\n§E新岗位:§! \n每 50 £pop£ £mod_job_sky_clerk_add£ $job_sky_clerk$ §G+1§! \n$job_sky_clerk_effect_desc$"
 MasterNature.skymall_expanded.tooltip: "步骤1：建岛\n步骤2：? ?\n步骤3：获得利润。 \n\n§H$ON_COMPLETION$:§! \n每 40 £pop£ £mod_job_sky_clerk_add£ $job_sky_clerk$ §G+1§! \n$job_sky_clerk_effect_desc$"
 MasterNature.skymallbuilt.name: "天空商城在你头顶开张!"
 MasterNature.skymallbuilt.desc: "随着天空商城-[Root.Planet.GetName]™的推出，我们的公民对一个全新的物质奢侈领域持开放态度。企业利润突破了所有的预期，不清楚[Root.Owner.GetSpeciesClassPlural]之前是如何在没有便利地在他们头顶上购买每一种已知产品的情况下生活的。"
 MasterNature.skymallbuilt2.name: "我就不能去虚境网下单吗？"
 MasterNature.skymallbuilt2.tooltip: "可以，但是他们收的运费太高了。 \n\n每 40 £pop£ £mod_job_sky_clerk_add£ $job_sky_clerk$ §G+1§! \n$job_sky_clerk_effect_desc$ \n\n§E$NEW_DISTRICTS$§!"

 MasterNature.skygreen.name: "发现一片美丽的空中绿地"
 MasterNature.skygreen.tooltip: "更“高”一级的自然。 \n\n§H$ON_COMPLETION$:§! \n\n§E行星修正:§! \n£unity $unity$ §G+10%§! \n£mod_planet_stability_add£ $PLANET_STABILITY_TITLE$ §G+10§! \n\n§E新岗位:§! \n每 50 £pop£ £mod_job_sky_ranger_add£ $job_sky_ranger$ §G+1§! \n$job_sky_ranger_effect_desc$"
 MasterNature.skygreen_gestalt.tooltip: "更“高”一级的自然。 \n\n§H$ON_COMPLETION$:§! \n\n§E行星修正:§! \n£unity $unity$ §G+10%§! \n£mod_planet_stability_add£ $PLANET_STABILITY_TITLE$ §G+10§! \n\n§E新岗位:§! \n每 50 £pop£ £mod_job_sky_maintenance_add£ $job_sky_maintenance$ §G+1§! \n$job_sky_maintenance_effect_desc$"
 MasterNature.skygreen_expanded.tooltip: "更“高”一级的自然。 \n\n§H$ON_COMPLETION$:§! \n每 40 £pop£ £mod_job_sky_ranger_add£ $job_sky_ranger$ §G+1§! \n$job_sky_ranger_effect_desc$"
 MasterNature.skygreen_gestalt_expanded.tooltip: "更“高”一级的自然。 \n\n§H$ON_COMPLETION$:§! \n每 40 £pop£ £mod_job_sky_maintenance_add£ $job_sky_maintenance$ §G+1§! \n$job_sky_maintenance_effect_desc$"
 MasterNature.skygreenbuilt.name: "新的空中绿地让其他所有的公园都黯然失色"
 MasterNature.skygreenbuilt.desc: "我们漂浮在空中的天堂现在是开放的。居民免费宽敞的绿色梯田、娱乐场所和俯瞰云层的华丽长椅。所有的长椅都配有舒适的扶手，使得大多数脊椎动物无法入睡。困在终端机的乏味后面，或者困在一个沉闷的老板后面？梦想着完美的假期？现在比以往任何时候都更容易把你的头从云里拿出来，只需要来这里！"
 MasterNature.skygreenbuilt2.name: "等等，我们不收门票吗?"
 MasterNature.skygreenbuilt2.tooltip: "肮脏的资本家。 \n\n每 40 £pop£ £mod_job_sky_ranger_add£ $job_sky_ranger$ §G+1§!\n$job_sky_ranger_effect_desc$ \n\n§E$NEW_DISTRICTS$§!"
 MasterNature.skygreenbuilt2_gestalt.tooltip: "肮脏的资本家。 \n\n每 40 £pop£ £mod_job_sky_maintenance_add£ $job_sky_maintenance$ §G+1§!\n$job_sky_maintenance_effect_desc$ \n\n§E$NEW_DISTRICTS$§!"

 MasterNature.skyestate.name: "为精英阶层建设空中之城"
 MasterNature.skyestate.tooltip: "肯定会有一些东西滴落下来。 \n\n§H$ON_COMPLETION$:§! \n\n§E行星修正:§! \n$mod_pop_cat_ruler_happiness$ £mod_ruler_happiness£ §G+50%§!\n$mod_pop_cat_worker_happiness$ £mod_worker_unhappiness£ §R-20%§!\n§RReplaces other Sky Island Modifiers§! \n\n§E新工作:§! \n每 100 £pop£ £mod_job_sky_noble_add£ $job_sky_noble$ §G+1§!\n每 66 £pop£ £mod_job_enforcer_add£ $job_enforcer$ §G+1§!\n$job_sky_noble_effect_desc$ \n§H$EMPIRE_UNIQUE_BUILDING$§!"
 MasterNature.skyestatebuilt.name: "在[Root.Owner.GetName]中，贫富差距变成了高度差距"
 MasterNature.skyestatebuilt.desc: "随着新的空中之城建成，当地的精英们发誓再也不会踏上[Root.Planet.GetName]的土地。地方当局对这些云端居民的限制相对较小，这些居民肯定会尽其所能，以保持他们的“高”地位。有些人甚至撂下狠话，让他们高兴才是我们帝国的最大利益，无论这意味着什么。在下面，乌合之众抱怨这如何完美地象征了这个系统固有的不平等，但说实话，你在上面是听不到他们声音的。"
 MasterNature.skyestatebuilt2.name: "我在上面也有一栋房子吗?"
 MasterNature.skyestatebuilt2.tooltip: "当然，阁下。 \n\n每 100 £pop£ £mod_job_sky_noble_add£ $job_sky_noble$ §G+1§! \n每 66 £pop£ £mod_job_enforcer_add£ $job_enforcer$ §G+1§! \n$job_sky_noble_effect_desc$ \n\n§E$NEW_DISTRICTS$§!"

 MasterNature.skyroost.name: "塑造一个田园诗般的空中栖息地"
 MasterNature.skyroost.tooltip: "孵化将会非常“高\"。 \n\n§H$ON_COMPLETION$:§! \n\n§E行星修正:§! \n£mod_planet_amenities_no_happiness_mult£ $MOD_PLANET_AMENITIES_NO_HAPPINESS_MULT$ §G+15%§! \n\n§E新岗位:§! \n每 40 £pop£ £mod_job_sky_spawning_drone_add£ $job_sky_spawning_drone$ §G+1§! \n$job_sky_spawning_drone_effect_desc$"
 MasterNature.skyroost_expanded.tooltip: "孵化将会非常“高\"。 \n\n§H$ON_COMPLETION$:§! \n每 40 £pop£ £mod_job_sky_spawning_drone_add£ $job_sky_spawning_drone$ §G+1§! \n$job_sky_spawning_drone_effect_desc$"
 MasterNature.skyroostbuilt.name: "空中栖息地让[Root.Planet.GetName]的幼年子个体“高”抬一手"
 MasterNature.skyroostbuilt.desc: "新建成的空中栖息地将允许幼年子个体在田园诗般的环境中发育，而不会妨碍行星上的集体活动。预计整个蜂巢内意外踩踏幼体的事件将下降92.4%。高海拔和低氧环境预计对健康有长期的好处，可以培养更强壮和更有韧性的子个体，为蜂巢的发展做出重大贡献。 \n\n饲养新的幼体将专门的栖息地子个体的责任,而不是一种采矿子个体和研究子个体在再生周期之外的额外负担。我们对云层中的童年奇迹的共同记忆将是我们所有[Root.Owner.GetSpeciesPlural]的福音。"
 MasterNature.skyroostbuilt2.name: "蜂巢是关于家庭的一切"
 MasterNature.skyroostbuilt2.tooltip: "所有子个体都同意。\n\n 每 40 £pop£ £mod_job_sky_spawning_drone_add£ $job_sky_spawning_drone$ §G+1§!\n$job_sky_spawning_drone_effect_desc$ \n\n§E$NEW_DISTRICTS$§!"

 MasterNature.skyfactory.name: "打造空中装配工厂"
 MasterNature.skyfactory.tooltip: "别担心，是工厂在飞，不是机器人。 \n\n§H$ON_COMPLETION$:§! \n\n§E行星修正:§! \n$MOD_PLANET_POP_ASSEMBLY_MULT$ £mod_planet_pop_assembly_mult£ §G+25%§! \n$mod_planet_pop_assemblers_upkeep_mult$ £assembly_cost£ §R+10%§! \n\n§E新岗位:§! \n每 40 £pop£ £mod_job_sky_roboticist_add£ $job_sky_roboticist$ §G+1§! \n$job_sky_roboticist_effect_desc$"
 MasterNature.skyfactory_gestalt.tooltip: "别担心，是工厂在飞，不是机器人。 \n\n§H$ON_COMPLETION$:§! \n\n§E行星修正:§! \n$mod_planet_pop_assembly_mult$ £mod_planet_pop_assembly_mult£ §G+25%§! \n$mod_planet_pop_assemblers_upkeep_mult$ £assembly_cost£ §R+10%§! \n\n§E新岗位:§! \n每 40 £pop£ £mod_job_sky_replicator_add£ $job_sky_replicator$ §G+1§! \n$job_sky_replicator_effect_desc$"
 MasterNature.skyfactory_expanded.tooltip: "别担心，是工厂在飞，不是机器人。 \n\n§H$ON_COMPLETION$:§! \n每 40 £pop£ £mod_job_sky_roboticist_add£ $job_sky_roboticist$ §G+1§! \n$job_sky_roboticist_effect_desc$"
 MasterNature.skyfactory_gestalt_expanded.tooltip: "别担心，是工厂在飞，不是机器人。 \n\n§H$ON_COMPLETION$:§! \n每 40 £pop£ £mod_job_sky_replicator_add£ $job_sky_replicator$ §G+1§! \n$job_sky_replicator_effect_desc$"
 MasterNature.skyfactorybuilt.name: "云上机器人:[Root.Planet.GetName]的下一个大新闻"
 MasterNature.skyfactorybuilt.desc: "我们伟大的天空工厂开业了，第一批产品此刻正从装配车间推出。关于该项目的公司小册子如下: \n\n为了避免许多此类建筑项目面临的 \"不要在我的后院建造机器人工厂 \"这种几乎无处不在的抱怨，天空工厂公司采取了下一个合乎逻辑的步骤，建造一个浮动的机器人工厂。这被证明是一个明智的商业决定，想想当工厂本身可以直接来到你身边时，你可以节省多少钱。更令人兴奋的是，该设施几乎是完全自动化的，可以抵御破坏行为和企业间谍活动，并有一个自我学习的算法。\n\n有时候，企业的营销活动可能非常可怕。只要我们承诺永远不关闭它，我们可能就会没事，对吧?你紧张地看着你的机器人管家。"
 MasterNature.skyfactorybuilt2.name: "感激不尽，机器人先生"
 MasterNature.skyfactorybuilt2.tooltip: "机器人第四定律：不管第一，第二和第三定律如何，在空中散热更快。\n\n每 40 £pop£ £mod_job_sky_roboticist_add£ $job_sky_roboticist$ §G+1§! \n$job_sky_roboticist_effect_desc$ \n\n§E$NEW_DISTRICTS$§!"
 MasterNature.skyfactorybuilt2_gestalt.tooltip: "机器人第四定律：不管第一，第二和第三定律如何，在空中散热更快。\n\n每 40 £pop£ £mod_job_sky_replicator_add£ $job_sky_replicator$ §G+1§! \n$job_sky_roboticist_effect_desc$ \n\n§E$NEW_DISTRICTS$§!"

 MasterNature.nevermind: "别介意"
 MasterNature.nevermind.tooltip: "你缺乏远见。\n\n退款："

 foundry_fracture_event_chain_title: "铸造厂的恐惧"
 foundry_fracture_event_chain_desc: "一系列的地震对[Root.Planet.GetName]造成了严重的破坏，对殖民地的基础设施造成了广泛的破坏。许多人认为地下铸造厂是根本原因，但我们的首席工程师发誓，所有的地震遏制系统都完全正常。地震是不可预测的，没有证据表明最近发生的事件有关联。 \n\n尽管如此，法律挑战越来越多，在艺术家协会一段名为《我们没有纵火》的全息影像病毒式传播后，要求采取行动的公众压力急剧上升。我们可以镇压这种异议，或者对铸造厂的安全协议进行公开调查。这样的措施会平息当地人的恐惧，但也会扰乱铸造厂的产出。"
 MasterNature_event.31.name: "铸造厂的恐惧"
 MasterNature_event.31.desc: "一系列的地震对[Root.Planet.GetName]造成了严重的破坏，对殖民地的基础设施造成了广泛的破坏。许多人认为地下铸造厂是根本原因，但我们的首席工程师发誓，所有的地震遏制系统都完全正常。地震是不可预测的，没有证据表明最近发生的事件有关联。 \n\n尽管如此，法律挑战越来越多，在艺术家协会一段名为《我们没有纵火》的全息影像病毒式传播后，要求采取行动的公众压力急剧上升。我们可以镇压这种异议，或者对铸造厂的安全协议进行公开调查。这样的措施会平息当地人的恐惧，但也会扰乱铸造厂的产出。"
 MasterNature_event.fine.name: "£fine£ 问题不大"
 MasterNature_event.fine.tooltip: "我对目前正在发生的事情没有意见。 \n\n§H影响:§!"
 MasterNature_event.bandemonstrations.name: "禁止示威游行"
 MasterNature_event.bandemonstrations.tooltip: "问题解决了。 \n\n§E防止进一步的不愉快处罚§!"
 MasterNature_event.investigatefoundry.name: "展开调查"
 MasterNature_event.investigatefoundry.tooltip: "你确定我们想知道吗?\n\n§H需要5级科学家§!"
 MasterNature_event.closefoundry.name: "关闭铸造厂"
 MasterNature_event.closefoundry.tooltip: "小心总比后悔好。\n\n§H解锁决策s:§! \n§E$decision_reopen_foundry$ \n$decision_investigate_foundry$§!"
 MasterNature_event.safetyprotocols.name: "启用安全协议"
 MasterNature_event.safetyprotocols.tooltip: "生命比合金更重要"
 MasterNature_event.32.name: "[Root.Planet.GetName]发生了另一场地震"
 MasterNature_event.301.name: "铸造厂的能量水平在构造扰动期间激增"
 MasterNature_event.302.name: "灾难降临：铸造厂发言人不予置评"
 MasterNature_event.32.desc: "我们的总工程师仍然坚持认为，没有证据表明最近发生的事件不是巧合。地震活动是自然循环的一部分，比[Root.Owner.GetSpeciesNamePlural]可能产生的任何影响都要大得多。这没什么问题。"
 MasterNature_event.okay.name: "£fine£ 没关系"
 MasterNature_event.okay.tooltip: "一切都会好起来的。"
 MasterNature_event.33.name: "报告：铸造协议被认为不安全!"
 MasterNature_event.33.desc: "无论是出于贪婪还是严重的疏忽，铸造工程的高级员工都承认，为了维持生产配额，他们有时会忽视关键的系统警告。在回答提问时，一名工作人员报告说，他们不知道如果密封完整性系统到达红色区域会发生什么，但如果他们考虑以安全的名义削减生产目标，他们就会失去工作。这种生产目标高于一切的态度渗透到铸造管理的每一个层面。 \n\n调查人员报告说，忽视安全机制可能是最近地震活动和行星基础设施破坏的原因。在最坏的情况下，这可能会导致遏制措施的破裂。然而，一名科学家含糊其辞地说：“当没有东西可以烧的时候，你必须把星球放在火上”。”\n\n该委员会已经发布了关于新的安全协议的建议。这可能意味着生产的净损失，但你能用合金来衡量生命吗？一些人声称，建议的安全措施是多余的，随着我们生产技术的提高，不管怎么说，这份报告显然对目前的高级工程人员是个打击，公众期待着一个强有力的回应。活动人士要求总工程师[foundry_engineer.GetName]辞职，并威胁说如果他们的要求没有得到满足，将采取法律行动。"
 MasterNature_event.fired.name: "有人该对此负责"
 MasterNature_event.fired.tooltip: "你被解雇了。 \n\n§R[foundry_engineer.GetName] 辞职§! \n§H解锁决策:§! §E安全协议§!"
 MasterNature_event.legal.name: "委员会总是带来坏消息"
 MasterNature_event.legal.tooltip: "安全?呸。 \n\n§H解锁决策:§! §E安全协议§!"
 MasterNature_event.34.name: "§R警报:§! 铸造厂裂缝"
 MasterNature_event.34.desc: "§H安全壳破裂!温度超过预期参数，表面完整性下降。这不是演\n\n§!从你的首席工程师§Y[foundry_engineer.GetName]§!的传输突然结束在一阵高音调的尖叫和随之而来的噪音。[Root.Planet.GetName]的情况非常糟糕，由于过热的金属泄漏，数千人丧生。事实证明，任何试图扑灭大火的努力都是徒劳的，因为它们是由岩浆直接点燃的，岩浆正通过铸造厂密封室的裂缝向上蔓延。 \n\n越来越多的火山灰云挡住了南半球的太阳，预计[Root.Planet.GetName]在几天内完全被火山灰包围。然而，这甚至不是最紧迫的问题。地震读数表明，裂缝正在扩大，远远超出了我们以前的铸造厂的范围，事实上，整个行星的地壳正在崩溃。如果不采取措施，整个星球可能会变得不适合居住。"
 MasterNature_event.really.tooltip: "是吗?"
 MasterNature_event.reallyreally.tooltip: "你还好吗?"
 MasterNature_event.35.name: "裂缝在[Root.Planet.GetName]上扩展"
 MasterNature_event.35.desc: "另一个鸿沟出现在[Root.Planet.GetName]的郊区，吞噬了当地基因诊所的整个工作班次。虽然这显然是一种损失，但基因疗法不太可能对目前涌入的三度熔岩烧伤患者有很大帮助。[Root.Planet.GetName]的居民注定要灭亡吗?政府会帮助我们吗?他们真的在乎吗?"
 MasterNature_event.36.name: "地震稳定协议"
 MasterNature_event.36.desc: "我们的铸造厂已经无法挽救，但[Root.Planet.GetName]或许可以。理论上我们可以尝试使用地下共振发射器努力将断裂的行星地壳震回原位。如果你愿意，这是一场反向地震。这将需要极其详细的传感器读数，巨大的电力支出，以及相当大的运气。如果成功的话，我们可以将[Root.Planet.GetName]恢复到这场灾难之前的状态，也许有一天我们甚至可以重建我们的地下建筑群，并加固它以应对未来的失败。\n\n或者，我们可以简单地控制损害。如果我们用足够的材料密封每一个表面裂缝，并集中的引爆一系列炸药，使原来的铸造主腔坍塌，我们也许能够在原来的核容器破裂蔓延到整个表面之前堵住它。使以前的铸造厂主室坍塌，我们也许能够在它蔓延到整个表面之前堵住最初的核心密封漏洞。不幸的是，这对已经喷发到大气层的火山灰没有任何帮助，[Root.Planet.GetName]再也不会再和以前一样了。"
 MasterNature_event.stabalize.name: "稳定星球"
 MasterNature_event.stabalize.tooltip: "反向地震？\n\n§H需要:§! \n$tech_sensors_3$ \n$tech_antimatter_power$ \n§G高§!成功率"
 MasterNature_event.contain.name: "遏制损害"
 MasterNature_event.contain.tooltip: "反正我也不喜欢以前天空的样子。\n\n§Y中§!成功率 \n行星将成为§R$pc_nuked$§!"
 MasterNature_event.ignore: "£fine£ 希望得到最好的结果"
 MasterNature_event.ignore.tooltip: "船到桥头自然直\n\n§R低§!成功率 \n行星将会成为§R$pc_nuked$§!"
 MasterNature_event.37.name: "灾难性的失败"
 MasterNature_event.37.desc: "我们的星球消失了。在我们的铸造厂安全壳系统发生故障导致的连锁反应扩散并最终液化了整个行星的地壳之后，[Root.Planet.GetName]曾经富饶的表面现在变成了一片燃烧的废墟。虽然这是一个可怕的事件，但我们现在知道是什么导致了这个问题，并且可以把责任牢牢地归咎于我们的前首席工程师的故意盲目性。管理层忽视了一系列关键的警告，部分原因是为了满足生产配额的无情压力。我们已经起草了新的安全协议，以防止此类悲剧在其他地方发生。"
 MasterNature_event.lost.name: "[Root.Planet.GetName]将被永远铭记"
 MasterNature_event.lost.tooltip: "这一点都不好。\n\n§H解锁决策:§! §E安全协议§!"
 MasterNature_event.38.name: "[Root.Planet.GetName]得救了!"
 MasterNature_event.38.desc: "火势正在减弱，不断升级的地震活动已经停止。这确实证明了[Root.Planet.GetName]人民的坚韧。然而，我们不应该这样的灾难发生。科学家们估计，这个星球的地壳仅仅几个月内就会完全破碎，把[Root.Planet.GetName]变成一个不适合居住的熔融星球。但是，我们已经从错误中吸取了教训，并起草了新的安全协议，以防止这种悲剧在其他地方发生。"
 MasterNature_event.saved.name: "看，这一切都很好。"
 MasterNature_event.saved.tooltip: "一切都会好起来的。\n\n§H解锁决策:§! §E安全协议§!"

