l_simp_chinese:

 ship_CSS_BB_CARRIER: "舰载机母舰"
 CSS_BB_CARRIER: "舰载机母舰"
 CSS_BB_CARRIER_plural: "舰载机母舰"
 CSS_BB_CARRIER_slots: " [ H5 / L2 A2 ]"
 CSS_BB_CARRIER_desc: "专业的舰载机母舰，可以携带大量飞行器，并具有大幅的交战范围加成。它们可以在敌舰火炮射程之外发起战斗，但由于与标准战舰相比装甲较低，在近战中可能变得危险。作为专用于舰载机母舰的装备，无法拦截敌方飞行器的轰炸机具有更强的反舰战斗能力。如果你使用ESC NEXT，你还可以在其他舰船上使用轰炸机。"
 CSS_BB_CARRIER_flav: "舰载机母舰是使用本物种开发的各种飞行器进行战斗的大型舰船。它们可以携带比标准飞行器更专业的反舰轰炸机。此外，特殊的飞行器控制系统允许您从远处发射飞行器中队，追捕敌人。"
 
 ship_CSS_CC_EXPLOSIVE: "军火库舰"
 CSS_CC_EXPLOSIVE: "军火库舰"
 CSS_CC_EXPLOSIVE_plural: "军火库舰"
 CSS_CC_EXPLOSIVE_slots: " [ M3 S8 / M8 A2 ]"
 CSS_CC_EXPLOSIVE_desc: "军火库舰获得了大幅的武器射程加成，可以从非常远的距离发射导弹。最好装备“炮击作战电脑”在保持机动优势的前提下以最大化远程射程的优势。除了爆炸性武器（导弹）之外的所有武器不应该被装备，因为它们会对战斗力造成严重影响。"
 CSS_CC_EXPLOSIVE_flav: "军火库舰是该物种将多功能导弹舰设计推向极致的舰船。这些火力导向的舰船配备了庞大的导弹发射装置，并配备了先进的制导设备，可以从更远的距离传递导弹火力。"
 
 ship_CSS_CC_DEFENDER: "守卫者"
 CSS_CC_DEFENDER: "守卫者"
 CSS_CC_DEFENDER_plural: "守卫者"
 CSS_CC_DEFENDER_slots: " [ P7 / M10 A3 ]"
 CSS_CC_DEFENDER_desc: "所有武器插槽均为P槽。这种巡洋舰拥有很强的射程和跟踪能力加成，寻常战术难以过载由它们组成的点防御阵列，它是对抗航母舰载机和导弹的最强反制武器。"
 CSS_CC_DEFENDER_flav: "集成的先进传感系统和防空系统是该舰种众所周知的强项。防御者是配备了各种点防御系统的战舰，专门猎杀敌方'飞行器'，将成为您舰队的可靠盾牌。"
 
 ship_CSS_CO_ASSAULT: "搏斗者"
 CSS_CO_ASSAULT: "搏斗者"
 CSS_CO_ASSAULT_plural: "搏斗者"
 CSS_CO_ASSAULT_slots: " [ M1 S2 / S5 A1 ]"
 CSS_CO_ASSAULT_desc: "这些是高端护卫舰，速度、攻击力和防御力全面增强。它拥有基础追踪率加成，使其在与其他护卫舰的对抗中更加强大。价格也更高。"
 CSS_CO_ASSAULT_flav: "说到飞行，其实即使是在广袤的太空中，也没有几个人可以比得上这个物种。尤其是，这个物种已经开发出了自己的全副武装的高速小型飞船，而这种设计的最终进化就是搏斗者。"
 
 ship_CSS_BB_MONITOR: "主权巡视舰"
 CSS_BB_MONITOR: "主权巡视舰"
 CSS_BB_MONITOR_plural: "主权巡视舰"
 CSS_BB_MONITOR_slots: " [ X2 / L6 ]"
 CSS_BB_MONITOR_desc: "慢速战舰，在炮塔中安装有两个不受射击角度影响的X槽武器。在友好星系中，你的舰船武器射速会得到加成；但在敌对星系中，你的舰船武器射速反而会受到削弱。与其他战列舰相比，它有射程加成，因此在战列舰之间的全面战斗中表现出色，但在对付靠近的小型舰艇和鱼雷时就显得乏力了。考虑到敌方小型舰艇的接近，它最适合装备“炮击作战电脑”。"
 CSS_BB_MONITOR_flav: "该物种的“战舰”拥有超大口径炮塔，其船体非常庞大。主权监护者倚靠附近恒星基地的作战链路支援，在友方星系中释放极强的火力，但如果没有这种帮助，在战斗中将非常脆弱。"
 
 ship_CSS_CC_CARRIER: "护航航母"
 CSS_CC_CARRIER: "护航航母"
 CSS_CC_CARRIER_plural: "护航航母"
 CSS_CC_CARRIER_slots: " [ H3 / M2 A1 ]"
 CSS_CC_CARRIER_desc: "这些是巡洋舰大小的船只，可以廉价携带大量飞行器。然而，没有其他加成，船只的防御被处罚并且非常薄弱。作为专用于护航航母的装备，无法拦截敌方飞行器的轰炸机具有更强的反舰战斗能力。如果你使用ESC NEXT，你还可以在其他舰船上使用轰炸机。"
 CSS_CC_CARRIER_flav: "该物种更喜欢一种不同的飞行器和航母的方法。换句话说，人们认为，与其依赖少数大型航母，不如运营一些大小与巡洋舰相当的便宜且快速的小型航母更灵活和有用。护航航母是这种设计理念的表达。"
 
 ship_CSS_BB_INTERDICTOR: "拦截舰"
 CSS_BB_INTERDICTOR: "拦截舰"
 CSS_BB_INTERDICTOR_plural: "拦截舰"
 CSS_BB_INTERDICTOR_slots: " [ H3 / L4 A2 ]"
 CSS_BB_INTERDICTOR_desc: "具有减速敌舰、使其在亚光速下难以逃脱的光环装置，并使其难以逃离到其他星系。由于只配备了基于航母的舰载机平台，最好装备“航母作战电脑”使其在舰队的后方保持远距离作战。"
 CSS_BB_INTERDICTOR_flav: "该物种被认为对超空间路径特别敏感。他们的特殊感知能力可以被放大并用于有效地干扰演习和星际移动。然而，这种设备需要庞大的专用舰船设计。"
 
 ship_CSS_JG_WARFLOWER: "战争莲花"
 CSS_JG_WARFLOWER: "战争莲花"
 CSS_JG_WARFLOWER_plural: "战争莲花"
 CSS_JG_WARFLOWER_slots: ""
 CSS_JG_WARFLOWER_desc: "这是一个巨大的移动堡垒。与普通船只不同，它必须通过建造船只的大脚手架来生产，每个帝国只能拥有一个。它防御力高，在战斗中非常强大，但无法通过超空间，并且只能通过跳跃驱动器移动。"
 CSS_JG_WARFLOWER_flav: "该物种与其母星有着密切的关系。因此，他们别无选择，只能更加关注他们星系的防御，这导致了这座庞大的防御要塞的设计。这座要塞没有超空间导航能力，但以雄伟的姿态保卫着星系。"
 
 ship_CSS_CC_GUARDIAN: "卫士"
 CSS_CC_GUARDIAN: "卫士"
 CSS_CC_GUARDIAN_plural: "卫士"
 CSS_CC_GUARDIAN_slots: " [ S2 P2 / L6 A2 ]"
 CSS_CC_GUARDIAN_desc: "巡洋舰级别的舰船，拥有最高的耐久性。它配备了一种用于战列舰的大型防御槽，甚至具有自己的防御加成。然而，要小心武器槽非常有限。"
 CSS_CC_GUARDIAN_flav: "这个物种建造的飞船具有非常坚固的船体结构。这要归功于一种只有岩石种族能够理解和合成的特殊晶格结构合金。由于设计追求最大防御，这种结构的船舶非常坚固，但武器系统非常有限。"
 
 ship_CSS_TI_REJUVENATOR: "再生者"
 CSS_TI_REJUVENATOR: "再生者"
 CSS_TI_REJUVENATOR_plural: "再生者"
 CSS_TI_REJUVENATOR_slots: " [ H6 P4 / L12 A2 ]"
 CSS_TI_REJUVENATOR_desc: "泰坦级航母，配备非常强大的治疗光环。它本身的战斗力并不高，但能增加整个舰队的再生能力。默认情况下可以拥有 1 艘，舰队容量每增加 400 便可增加 1 艘。"
 CSS_TI_REJUVENATOR_flav: "这个物种已经完善了一种秘密技术--或者说仪式--在生与死的交界处稍稍颠覆了熵的正常进程。将这种技术应用到战舰上具有挑战性，但对于专门设计的巨型战舰来说也许是可行的。"
 
 ship_CSS_DD_SNIPER: "脊峰猎手驱逐舰"
 CSS_DD_SNIPER: "脊峰猎手驱逐舰"
 CSS_DD_SNIPER_plural: "脊峰猎手驱逐舰"
 CSS_DD_SNIPER_slots: " [ X1 / S4 ]"
 CSS_DD_SNIPER_desc: "一艘在舰艏固定有一个X槽武器的驱逐舰。它的射速相较常规轴基舰艏受到了削弱，但在射程上获得了加成，并且可以用很少的资源和较低的舰容量装备最多的X槽武器。如果您使用BSB模组，那么装备“狙击作战电脑”是最适合的，它可以在最大射程加成下进行远距离作战。"
 CSS_DD_SNIPER_flav: "相对于飞船的大小而言，使用巨大的 “鱼叉 ”对这个物种来说再熟悉不过了。猎手驱逐舰就是这种飞船设计在太空中的延伸。装备了对战舰来说过于沉重的超大型火炮的驱逐舰看起来十分可笑，但了解其破坏力的敌人绝不会嘲笑它们。"
 
 ship_CSS_DD_TORPEDO: "爆破舰"
 CSS_DD_TORPEDO: "爆破舰"
 CSS_DD_TORPEDO_plural: "爆破舰"
 CSS_DD_TORPEDO_slots: " [ G3 / S6 A1 ]"
 CSS_DD_TORPEDO_desc: "一艘优化用于从爆炸性鱼雷进行近战攻击的驱逐舰。您可以根据舰船容量使用最多的G槽，但只能使用短程鱼雷，使近战成为必要。隐形部件可以使您更有力地进行战斗。不应装备能量鱼雷，因为它们会对战斗力造成严重影响。"
 CSS_DD_TORPEDO_flav: "由于这个物种对生物化学知识的认知十分先进，导致他们设计的爆炸性武器也异常强大。他们对爆炸的热爱在太空船设计中也得以延续。艺术就是————轰隆隆!"
 
 ship_CSS_CC_DRONE: "[智械]无人炮艇舰"
 CSS_CC_DRONE: "[智械]无人炮艇舰"
 CSS_CC_DRONE_plural: "[智械]无人炮艇舰"
 CSS_CC_DRONE_slots: " [ H1 / M4 A2 ]"
 CSS_CC_DRONE_desc: "巡洋舰级别的舰船，使用名为“无人炮艇”的专用舰载机。这种专用舰载机无法与常规舰载机的火力相匹敌，但它们特殊性就在于拥有跟战列舰的主炮相同的射程，这使得它们可以轻松的在常规近程点防御武器射程之外发动攻击。但它们也更容易受到敌方舰载机的反制，“无人炮艇舰”无法拦截敌方舰载机或导弹。"
 CSS_CC_DRONE_flav: "该物种的军用无人机是为了在外太空直接作战而研发的，无人炮艇的母舰也是无人化飞船。它们放弃了所有其他武器，转而专用“无人炮艇”这种舰载机。"
 
 ship_CSS_JG_DREADNOUGHT: "[智械]无畏战舰"
 CSS_JG_DREADNOUGHT: "[智械]无畏战舰"
 CSS_JG_DREADNOUGHT_plural: "[智械]无畏战舰"
 CSS_JG_DREADNOUGHT_slots: " [ T1 X2 H6 M6 S7 P3 / L22 A5 ]"
 CSS_JG_DREADNOUGHT_desc: "只有歼灭者才能建造这种巨型战舰，而且只能建造一艘。专用动能T槽武器的射程比其他T槽火炮短，但破坏力更大；它还有防御加成，因此可以使用“哨戒作战电脑”在前锋作战，如果使用 BSB，则可以装备“狙击作战电脑”，转为从后方提供炮火支援。"
 CSS_JG_DREADNOUGHT_flav: "代表歼灭者意志的巨大旗舰。它是一次性消灭宇宙中所有有机生命体和同情它们的智能故障机器的泰坦。"
 
 ship_CSS_CO_SWARMLING: "[蜂巢]裂变虫群"
 CSS_CO_SWARMLING: "[蜂巢]裂变虫群"
 CSS_CO_SWARMLING_plural: "[蜂巢]裂变虫群"
 CSS_CO_SWARMLING_slots: " [ S1 / S1 ]"
 CSS_CO_SWARMLING_desc: "高速近战虫群。只能使用非动力近战武器。随着飞船装甲技术的研究，裂变虫群的武器也会得到增强。开发跃迁驱动器可进一步提高裂变虫群的速度和耐久性，并使其具备跃迁能力。"
 CSS_CO_SWARMLING_flav: "只有最残暴的虫群才能在太空中穿着厚重的装甲和金属爪子作战。吞噬虫群称这种虫群为裂变虫群。"
 
 ship_CSS_JG_MONSTER: "[蜂巢]贝希摩斯"
 CSS_JG_MONSTER: "[蜂巢]贝希摩斯"
 CSS_JG_MONSTER_plural: "[蜂巢]贝希摩斯"
 CSS_JG_MONSTER_slots: " [ T4 H6 / NONE ]"
 CSS_JG_MONSTER_desc: "贝希摩斯是虫群最强大的力量，以强大的能量火焰作战。它还拥有一个光环，可以强化周围的 裂变虫群。巨兽无法在星际基地造船厂建造，只能在蜂巢首都星球上通过决定孵化。"
 CSS_JG_MONSTER_flav: "贝希摩斯是吞噬虫群的意志。这种由掠夺本能创造出来的地狱怪物将其原始形态带回了太空战争中。"

 ship_CSS_BB_BROADSIDER: "扫荡者"
 CSS_BB_BROADSIDER: "扫荡者"
 CSS_BB_BROADSIDER_plural: "扫荡者"
 CSS_BB_BROADSIDER_slots: " [ M12 / L8 A3 ]"
 CSS_BB_BROADSIDER_desc: "一艘装备多门中口径火炮的战列舰。在中距离战斗中，它可以压制大多数敌舰，但在敌方的远程攻击面前可能不堪一击。不应装备爆炸性武器（导弹），因为它们会对战斗力造成严重影响。"
 CSS_BB_BROADSIDER_flav: "该物种喜欢大船，但对大炮的喜爱却不尽相同。虽然扫荡者没有大规模的大炮，但它们可以用无数中型炮台的在齐射中消灭来敌。"
 
 ship_CSS_BB_GALLEON: "大帆船"
 CSS_BB_GALLEON: "大帆船"
 CSS_BB_GALLEON_plural: "大帆船"
 CSS_BB_GALLEON_slots: " [ H1 M5 S2 P5 / L4 A2 -> L8 A2 ]"
 CSS_BB_GALLEON_desc: "一种廉价的战列舰级战舰，能够进行各种战斗。与其他战列舰相比，它可以更早研制成功。但它的防御力较弱，无法装备大型武器，在战列舰之间的全面战争中处于劣势。在获得泰坦技术后，大帆船可以升级到加强版，但需要额外的费用。"
 CSS_BB_GALLEON_flav: "该物种善于快速创造一些无论如何都能用得上的东西。再加上对更大飞船的渴望，终于可以把这艘建造粗糙的飞船送上太空了。"
 
 ship_CSS_BB_EXPLOSIVE: "毁灭者"
 CSS_BB_EXPLOSIVE: "毁灭者"
 CSS_BB_EXPLOSIVE_plural: "毁灭者"
 CSS_BB_EXPLOSIVE_slots: " [ L3 M2 S4 / L6 A2 ]"
 CSS_BB_EXPLOSIVE_desc: "一种可获得显著射程加成并使用专用L槽导弹的战舰。最好装备“炮击作战电脑”，以最大限度地发挥远距离的优势进行机动作战。除炸药（导弹）以外的所有武器都不应装备，因为它们会对战斗力造成严重影响。"
 CSS_BB_EXPLOSIVE_flav: "该物种使用违背常识的巨型导弹。这些疯狂的导弹只能安装在专门使用导弹的大型战舰上。这就是毁灭者。"
 
 ship_CSS_CC_SIEGE: "破城者"
 CSS_CC_SIEGE: "破城者"
 CSS_CC_SIEGE_plural: "破城者"
 CSS_CC_SIEGE_slots: " [ S6 / M8 A2 ]"
 CSS_CC_SIEGE_desc: "巡洋舰级飞船，专门从事轨道轰炸。在舰对舰战斗中效果不佳。"
 CSS_CC_SIEGE_flav: "该物种拥有无休止的攻城战历史，因此特别擅长攻击坚固的行星。破城者擅长轨道轰炸，在摧毁敌对星球的防御系统方面效率极高。"
 
 ship_CSS_CC_LOOTER: "私掠者"
 CSS_CC_LOOTER: "私掠者"
 CSS_CC_LOOTER_plural: "私掠者"
 CSS_CC_LOOTER_slots: " [ H1 / M2 A1 ]"
 CSS_CC_LOOTER_desc: "一种隐形飞船，可以从其他帝国拥有的恒星系中窃取资源。虽然它的作战能力很低，但它有一个特别强大的隐形系统。"
 CSS_CC_LOOTER_flav: "该物种对偷窃有特殊的道德标准。因此，在这个社会里，偷窃被抓是犯罪，但如果没有被抓，就会被视为合法的所有权转让。这在太空中并没有什么不同。"
