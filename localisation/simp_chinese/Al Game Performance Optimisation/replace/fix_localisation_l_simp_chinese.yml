  planet_pop_conversion_count: "人口计数换算"
  planet_pop_conversion_count_desc: "一种渐进式的人口控制协议，用以防止全银河范围内的时间相对性灾难（卡顿）。"

  country_pop_conversion_count: "人口计数换算"
