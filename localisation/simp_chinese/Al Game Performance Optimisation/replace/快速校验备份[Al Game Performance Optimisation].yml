  planet_pop_conversion_count_desc: "A scaling pop control protocol that prevents a galactic wide time relativity disaster."

  country_pop_conversion_count: "Pop Count Conversion"
  country_pop_conversion_count_desc: "A scaling pop control protocol compensator that prevents empire wide political disaster."

